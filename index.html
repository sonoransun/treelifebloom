<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Life's Tree Blooms — an animated journey through 4.54 billion years of Earth history: drifting continents, changing climate, mass extinctions and the growing tree of life.">
  <meta name="theme-color" content="#070b14">
  <title>Life's Tree Blooms — 4.5 billion years of life on Earth</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070b14'/%3E%3Cg fill='none' stroke='%23f2b84b' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M16 27V15'/%3E%3Cpath d='M16 19c-4-1-6-4-6-7'/%3E%3Cpath d='M16 17c4-1 6-4 6-8'/%3E%3C/g%3E%3Ccircle cx='10' cy='11' r='2.4' fill='%23e66767'/%3E%3Ccircle cx='22' cy='8' r='2.4' fill='%233987e5'/%3E%3Ccircle cx='16' cy='12' r='2.6' fill='%23f2b84b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/timeline.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/overlays.css">
  <link rel="stylesheet" href="css/dialogs.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/globe.css">
  <link rel="stylesheet" href="css/tree.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#timeline">Skip to timeline controls</a>

  <div id="app" data-view="map">
    <!-- Toolbar (js/ui/toolbar.js). It fits at every width: below 860px the title is visually
         hidden, and on phones the layer and panel toggles fold into the #btn-more menu. -->
    <header id="toolbar">
      <a id="brand" href="./" title="Life's Tree Blooms — back to the beginning">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M16 28V15"/>
            <path d="M16 20c-4.2-1-6.4-4.2-6.4-7.6"/>
            <path d="M16 17.5c4.2-1 6.4-4.4 6.4-8.6"/>
          </g>
          <circle class="bloom bloom-a" cx="9.6" cy="11.4" r="2.5"/>
          <circle class="bloom bloom-b" cx="22.4" cy="8" r="2.5"/>
          <circle class="bloom bloom-c" cx="16" cy="12.2" r="2.8"/>
        </svg>
        <h1 id="app-title">Life's Tree Blooms</h1>
      </a>

      <div id="era-badge" aria-hidden="true">
        <span id="era-swatch"></span>
        <span id="era-path"></span>
        <span id="era-name">Hadean</span>
      </div>

      <!-- Narrow screens only: opens the life & planet panel as a drawer / bottom sheet -->
      <button id="btn-sidebar" class="chip-btn only-narrow" type="button" aria-expanded="false" aria-controls="sidebar" title="Planet vitals and dominant life">Life</button>

      <div class="toolbar-spacer"></div>

      <div class="toolbar-group segmented" role="group" aria-label="View">
        <button id="btn-view-map" class="seg-btn active" type="button" aria-pressed="true" title="World map (1)">Map</button>
        <button id="btn-view-globe" class="seg-btn" type="button" aria-pressed="false" title="3D globe (2)">Globe</button>
        <button id="btn-view-tree" class="seg-btn" type="button" aria-pressed="false" title="Tree of life (3)">Tree</button>
      </div>

      <!-- Phones only: shows #toolbar-more as a drop-down menu -->
      <button id="btn-more" class="chip-btn icon-btn only-phone" type="button" aria-expanded="false" aria-controls="toolbar-more" aria-label="Map layers, chapters and legend" title="Layers, chapters &amp; legend">
        <svg class="more-mark" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="4" cy="10" r="1.8"/>
          <circle cx="10" cy="10" r="1.8"/>
          <circle cx="16" cy="10" r="1.8"/>
        </svg>
      </button>

      <!-- Inline in the bar; the drop-down under #btn-more on phones -->
      <div id="toolbar-more">
        <div class="toolbar-group" role="group" aria-label="Map layers">
          <button id="btn-plates" class="chip-btn" type="button" aria-pressed="false" title="Plate boundaries (P)">Plates</button>
          <button id="btn-labels" class="chip-btn active" type="button" aria-pressed="true" title="Place names and events (L)">Labels</button>
        </div>

        <div class="toolbar-group" role="group" aria-label="Panels">
          <button id="btn-chapters" class="chip-btn" type="button" aria-expanded="false" aria-controls="chapters-panel" title="Jump to a chapter (C)">Chapters</button>
          <button id="btn-legend" class="chip-btn" type="button" aria-expanded="false" aria-controls="legend-panel" title="Legend (G)">Legend</button>
        </div>
      </div>

      <button id="btn-help" class="chip-btn icon-btn" type="button" aria-haspopup="dialog" aria-label="Help, shortcuts and about the data" title="Help &amp; about (?)">?</button>
    </header>

    <!-- Visualization area -->
    <main id="viz-container">
      <!-- The stage holds the renderers and is the only thing that shakes during extinctions. -->
      <div id="viz-stage">
        <canvas id="canvas2d" role="img" aria-label="World map of the current moment in Earth history"></canvas>
        <div id="globe-container" role="img" aria-label="Globe of the current moment in Earth history"></div>
        <canvas id="canvas-tree" role="img" aria-label="Tree of life grown up to the current moment"></canvas>
      </div>

      <!-- "Where and when am I" card (js/ui/contextCard.js) -->
      <section id="context-card" aria-label="Current moment"></section>

      <!-- Milestone toast (js/ui/milestoneOverlay.js) -->
      <div id="milestone-overlay" class="hidden"></div>

      <!-- Mass-extinction card (js/ui/extinctionOverlay.js) -->
      <div id="extinction-overlay" class="hidden"></div>

      <!-- Legend (js/ui/legend.js) and chapters menu (js/ui/chapters.js) -->
      <div id="legend-panel" class="hidden" role="region" aria-label="Legend"></div>
      <div id="chapters-panel" class="hidden" role="region" aria-label="Chapters"></div>

      <!-- Transient notices: view loading, interaction hints (js/main.js). The live region wraps
           the pill so it is already in the accessibility tree when the first text arrives. -->
      <div id="view-notice-region" role="status">
        <div id="view-notice" class="hidden"></div>
      </div>
    </main>

    <!-- Life & planet panel (js/ui/sidebar.js) -->
    <aside id="sidebar" aria-label="Planet vitals and dominant life"></aside>

    <!-- Timeline & transport (js/ui/controls.js) -->
    <footer id="timeline" aria-label="Timeline"></footer>
  </div>

  <!-- Hover card (js/ui/speciesPopup.js) -->
  <div id="species-popup" class="hidden" role="tooltip"></div>
  <!-- Species dialog (js/ui/speciesModal.js) -->
  <div id="species-modal-root"></div>
  <!-- Help / shortcuts / about-the-data dialog (js/ui/help.js) -->
  <div id="help-root"></div>
  <!-- Intro and finale cards (js/ui/intro.js) -->
  <div id="intro-root"></div>
  <!-- Polite announcements for screen readers (period changes, extinctions, milestones) -->
  <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <p class="noscript">Life's Tree Blooms is an interactive visualization and needs JavaScript to run.</p>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
